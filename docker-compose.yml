services:
  postgres:
    image: postgres:16-alpine
    container_name: flujo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flujo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
